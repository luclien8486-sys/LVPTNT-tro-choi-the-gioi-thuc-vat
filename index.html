<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trò chơi thế giới thực vật - mức lớp 1</title>
<style>
:root{--green:#1d7b56;--green2:#2b9a6e;--soft:#f4fff7;--yellow:#ffd45d;--shadow:0 12px 30px rgba(18,93,60,.14);--pink:#ef5b86}
*{box-sizing:border-box}
body{margin:0;font-family:"Arial Rounded MT Bold","Nunito",system-ui,sans-serif;background:linear-gradient(180deg,#ebfff2,#eff7ff);color:#204636}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #ffbb46;outline-offset:3px}
.app{max-width:1220px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;color:var(--green);font-size:clamp(22px,3vw,34px)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill,.iconbtn{background:#fff;border:0;border-radius:999px;box-shadow:var(--shadow)}
.pill{padding:12px 18px;font-weight:900}
.iconbtn{width:52px;height:52px;font-size:24px}
.progress{display:flex;gap:8px;margin:18px 0}
.dot{height:11px;flex:1;border-radius:999px;background:#dcecdf}
.dot.done{background:#58c98a}
.dot.now{background:#ffbd49}
.stage{position:relative;overflow:hidden;background:rgba(255,255,255,.94);border:4px solid #fff;box-shadow:0 18px 60px rgba(42,103,74,.15);border-radius:34px;min-height:690px;padding:28px 20px 24px;text-align:center}
.stage:before{content:"";position:absolute;left:-90px;bottom:-160px;width:320px;height:320px;background:#dcf5d7;border-radius:50%}
.stage:after{content:"";position:absolute;right:-80px;top:-120px;width:260px;height:260px;background:#fff2c6;border-radius:50%}
.stage>*{position:relative;z-index:1}
.kicker{display:inline-block;padding:9px 18px;border-radius:999px;background:#fff2b9;color:#8b6400;font-weight:900}
.heading{font-size:clamp(30px,5vw,58px);line-height:1.08;margin:12px 0;color:var(--green)}
.sub{font-size:clamp(18px,2.4vw,25px);font-weight:800;line-height:1.35;max-width:920px;margin:0 auto 18px;color:#254a39}
.hero{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.hero .bigart{width:170px;height:170px}
.art{width:100%;height:100%;filter:drop-shadow(0 10px 10px rgba(0,0,0,.08))}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:1000px;margin:18px auto}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:900px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:760px}
.choice{border:4px solid #d4ebdb;background:linear-gradient(180deg,#fff,#f6fff8);border-radius:28px;min-height:215px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);color:#264939;transition:transform .12s,border-color .12s,background .12s}
.choice:hover{transform:translateY(-4px)}
.choice:disabled{cursor:default}
.choice:disabled:hover{transform:none}
.choice.correct{border-color:#45c27e;background:#dcfae6}
.choice.wrong{border-color:#f47d95;background:#ffe7ec}
.choice .artbox{width:min(100%,150px);height:138px}
.label{font-size:clamp(20px,2.2vw,28px);font-weight:900}
.primary{border:0;border-radius:999px;background:linear-gradient(135deg,#ffd65f,#ffab39);box-shadow:0 8px 0 #df8c23;color:#6d4500;font-weight:900;font-size:clamp(20px,2.6vw,27px);padding:17px 38px;min-width:220px}
.feedback{min-height:48px;font-size:27px;font-weight:900;margin:12px auto;color:#1d8653}
.feedback.err{color:#d85368}
.bottom{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:16px}
.note{text-align:center;margin-top:12px;color:#5f7f70;font-size:15px}
.order{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1050px;margin:18px auto}
.step{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#ffe18f;color:#7b5200;font-weight:900;font-size:22px}
.scorebig{font-size:64px;font-weight:900;color:var(--green);margin:8px 0}
.stars{font-size:64px;margin:8px 0}
.smallhint{font-size:16px;color:#5b7d6d}
@media(max-width:860px){
 .stage{padding:22px 10px 20px;min-height:720px;border-radius:24px}
 .choices,.choices.three,.choices.two,.order{grid-template-columns:1fr;gap:10px}
 .choice{min-height:176px;border-radius:20px}
 .choice .artbox{height:110px}
 .hero .bigart{width:120px;height:120px}
 .iconbtn{width:46px;height:46px}
}
</style>
</head>
<body>

<div class="app">
<header class="top">
  <div class="brand">🌿 THẾ GIỚI THỰC VẬT - MỨC LỚP 1</div>
  <div class="tools">
    <div class="pill" id="scoreTop">⭐ 0 điểm</div>
    <button class="iconbtn" id="replayVoice" title="Nghe lại" aria-label="Nghe lại">🗣️</button>
    <button class="iconbtn" id="toggleVoice" title="Bật tắt giọng đọc" aria-label="Bật tắt giọng đọc">🔊</button>
  </div>
</header>
<div class="progress" id="progress"></div>
<main class="stage" id="stage" aria-live="polite"></main>
<p class="note">Bản mới: sửa lỗi câu “Rễ”, tăng độ khó theo mức lớp 1, vẫn có giọng đọc chậm và rõ.</p>
</div>
<script>
const stage=document.getElementById('stage');
const progress=document.getElementById('progress');
const scoreTop=document.getElementById('scoreTop');
const replayVoice=document.getElementById('replayVoice');
const toggleVoice=document.getElementById('toggleVoice');
let slide=0, score=0, voiceOn=true, voiceTimer=null, picked=[];
const totalSlides=8, totalTasks=7, maxScore=70;
const prompts=[
 ['Xin chào con.','Đây là trò chơi thế giới thực vật mức lớp một.','Con bấm bắt đầu để chơi nhé.'],
 ['Nhiệm vụ một.','Hãy chọn đúng hai loại quả.','Con nhớ chọn đủ hai hình nhé.'],
 ['Nhiệm vụ hai.','Cây bị héo vì thiếu nước.','Con hãy chọn việc nên làm.'],
 ['Nhiệm vụ ba.','Bộ phận nào ở dưới đất và hút nước cho cây?','Con chọn thật chính xác nhé.'],
 ['Nhiệm vụ bốn.','Hãy xếp quá trình lớn lên của cây theo đúng thứ tự.'],
 ['Nhiệm vụ năm.','Nếu đặt cây trong hộp tối nhiều ngày, cây sẽ thiếu gì?'],
 ['Nhiệm vụ sáu.','Hãy chọn hai việc làm giúp cây phát triển tốt.'],
 ['Con đã hoàn thành trò chơi.','Cây cần nước, ánh sáng, đất tốt và sự chăm sóc của chúng mình.']
];
const taskState={orderIndex:0, expectedOrder:[1,2,0,3]};
function stopSpeak(){if(voiceTimer)clearTimeout(voiceTimer);try{speechSynthesis.cancel()}catch(e){}}
function getVietnameseVoice(){
  try{
    const voices=speechSynthesis.getVoices();
    const matches=voices.filter(v=>/^vi([_-]|$)/i.test(v.lang));
    return matches.find(v=>/google|microsoft|natural|việt|vietnam/i.test(v.name)) || matches[0] || null;
  }catch(e){return null}
}
function speak(parts){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  stopSpeak();
  const texts=(Array.isArray(parts)?parts:[parts]).map(t=>String(t).replace(/[🌿🌱🍌🍇💧☀️⭐🏆]/gu,'').trim()).filter(Boolean);
  const voice=getVietnameseVoice();
  let index=0;
  const nextPart=()=>{
    if(!voiceOn || index>=texts.length) return;
    const u=new SpeechSynthesisUtterance(texts[index++]);
    u.lang='vi-VN'; u.rate=0.84; u.pitch=1; u.volume=1;
    if(voice) u.voice=voice;
    u.onend=()=>voiceTimer=setTimeout(nextPart,520);
    u.onerror=()=>voiceTimer=setTimeout(nextPart,520);
    speechSynthesis.speak(u);
  };
  nextPart();
}
function speakSlide(){ speak(prompts[slide]); }
const art=(name,title='')=>`<svg class="art" role="img" aria-label="${title||name}" viewBox="0 0 200 200"><use href="#${name}"/></svg>`;
const heroArt=name=>`<div class="bigart">${art(name)}</div>`;
const button=(label,fn='next()')=>`<button class="primary" onclick="${fn}">${label}</button>`;
function base(kicker,title,desc,inside,footer=''){
  return `<span class="kicker">${kicker}</span><h1 class="heading">${title}</h1><p class="sub">${desc}</p>${inside}<div class="feedback" id="feedback"></div><div class="bottom" id="bottom">${footer}</div>`;
}
function card(item,i,handler='chooseSingle'){
  return `<button class="choice" data-i="${i}" onclick="${handler}(${i})"><div class="artbox">${art(item.pic,item.name)}</div><span class="label">${item.name}</span></button>`;
}
function updateScore(){ scoreTop.textContent=`⭐ ${score} điểm`; }
function feedback(ok,visible,spoken=''){
  const el=document.getElementById('feedback');
  el.textContent=visible;
  el.className='feedback'+(ok?'':' err');
  speak(spoken || visible);
}
function complete(explanation){
  score += 10;
  updateScore();
  feedback(true,'🎉 Chính xác! ' + explanation,['Chính xác.','Giỏi lắm con.', explanation]);
  document.getElementById('bottom').innerHTML = button(slide===6 ? '🏆 XEM KẾT QUẢ' : '🌼 TIẾP TỤC');
  [...stage.querySelectorAll('.choice')].forEach(b=>b.disabled=true);
}
function render(){
  picked=[];
  taskState.orderIndex=0;
  progress.innerHTML=Array.from({length:totalSlides},(_,i)=>`<div class="dot ${i<slide?'done':''} ${i===slide?'now':''}"></div>`).join('');
  updateScore();
  let html='';
  if(slide===0) html=base('🌼 SẴN SÀNG CHƯA?','KHÁM PHÁ THẾ GIỚI THỰC VẬT','Bản này có độ khó cao hơn, dành cho mức lớp 1.',`<div class="hero">${heroArt('tree')}${heroArt('wholeplant')}${heroArt('banana')}</div><p class="smallhint">Con hãy nghe kỹ câu hỏi rồi chọn đáp án nhé.</p>`,button('🌟 BẮT ĐẦU'));
  if(slide===1) html=base('🍌 NHIỆM VỤ 1','HÃY CHỌN ĐÚNG HAI LOẠI QUẢ','Trong 4 hình dưới đây, có đúng 2 loại quả.',`<div class="choices">${[
    {pic:'banana',name:'Quả chuối'},
    {pic:'carrot',name:'Cà rốt'},
    {pic:'grapes',name:'Quả nho'},
    {pic:'flower',name:'Bông hoa'}
  ].map((x,i)=>card(x,i,'chooseFruits')).join('')}</div>`);
  if(slide===2) html=base('💧 NHIỆM VỤ 2','CÂY BỊ HÉO RỒI!','Cây đang thiếu nước. Con nên làm gì?',`<div class="choices three">${[
    {pic:'water',name:'Tưới nước'},
    {pic:'toy',name:'Cho đồ chơi'},
    {pic:'banana',name:'Cho ăn chuối'}
  ].map((x,i)=>card(x,i,'chooseSingle')).join('')}</div>`);
  if(slide===3) html=base('🌱 NHIỆM VỤ 3','BỘ PHẬN NÀO Ở DƯỚI ĐẤT?','Bộ phận này hút nước từ đất để nuôi cây.',`<div class="hero">${heroArt('wholeplant')}</div><div class="choices three">${[
    {pic:'flower',name:'Hoa'},
    {pic:'leaf',name:'Lá'},
    {pic:'sprout',name:'Rễ'}
  ].map((x,i)=>card(x,i,'chooseSingle')).join('')}</div>`, '');
  if(slide===4) html=base('🌿 NHIỆM VỤ 4','XẾP ĐÚNG QUÁ TRÌNH LỚN LÊN CỦA CÂY','Con hãy chạm theo thứ tự đúng: từ hạt đến cây trưởng thành.',`<div class="order">${[
    {pic:'plant',name:'Cây non'},
    {pic:'seed',name:'Hạt giống'},
    {pic:'sprout',name:'Mầm cây'},
    {pic:'tree',name:'Cây trưởng thành'}
  ].map((x,i)=>`<button class="choice" data-i="${i}" onclick="chooseOrder(${i})"><div class="artbox">${art(x.pic,x.name)}</div><span class="step">${i+1}</span><span class="label">${x.name}</span></button>`).join('')}</div><p class="sub" id="orderHelp">Gợi ý: Hạt → Mầm → Cây non → Cây trưởng thành</p>`);
  if(slide===5) html=base('☀️ NHIỆM VỤ 5','CÂY Ở TRONG HỘP TỐI','Nếu bị để trong chỗ tối nhiều ngày, cây sẽ thiếu gì?',`<div class="choices three">${[
    {pic:'water',name:'Nước'},
    {pic:'sun',name:'Ánh sáng'},
    {pic:'toy',name:'Đồ chơi'}
  ].map((x,i)=>card(x,i,'chooseSingle')).join('')}</div>`);
  if(slide===6) html=base('🌼 NHIỆM VỤ 6','CHỌN HAI VIỆC LÀM TỐT CHO CÂY','Có 2 việc làm giúp cây phát triển tốt.',`<div class="choices">${[
    {pic:'water',name:'Tưới nước vừa đủ'},
    {pic:'sun',name:'Đặt nơi có nắng'},
    {pic:'toy',name:'Giẫm lên chậu'},
    {pic:'carrot',name:'Bứt lá liên tục'}
  ].map((x,i)=>card(x,i,'chooseCare')).join('')}</div>`);
  if(slide===7){
    const stars = score>=60 ? '🌟🌟🌟' : score>=40 ? '🌟🌟' : '🌟';
    const textScore = score>=60 ? 'Xuất sắc! Con đã nắm kiến thức rất tốt.' : score>=40 ? 'Giỏi lắm! Con hiểu khá nhiều về cây rồi.' : 'Con đã cố gắng tốt. Chúng mình cùng chơi lại nhé!';
    html=base('🏆 HOÀN THÀNH','CON LÀ CHUYÊN GIA NHÍ VỀ THỰC VẬT!','Chúc mừng con đã vượt qua bản nâng cấp.',`<div class="stars">${stars}</div><div class="scorebig">${score} / ${maxScore}</div><p class="sub">${textScore}</p><div class="hero">${heroArt('tree')}${heroArt('yellowflower')}${heroArt('plant')}</div><p class="sub">Điều cần nhớ: rễ hút nước, lá giúp cây xanh, cây cần nước và ánh sáng.</p>`,button('🔄 CHƠI LẠI','restart()'));
  }
  stage.innerHTML=html;
  if(slide>0) setTimeout(speakSlide, 350);
}
function chooseFruits(i){
  const correct=[0,2];
  const buttons=[...stage.querySelectorAll('.choice')];
  if(buttons[i].disabled) return;
  if(!correct.includes(i)){
    buttons[i].classList.add('wrong');
    feedback(false,'Chưa đúng. Con hãy tìm quả nhé.','Hình này không phải quả. Con tìm lại nhé.');
    setTimeout(()=>buttons[i]&&buttons[i].classList.remove('wrong'),700);
    return;
  }
  buttons[i].classList.add('correct'); buttons[i].disabled=true; picked.push(i);
  if(picked.length===2) complete('Chuối và nho đều là quả.');
  else feedback(true,'Đúng rồi! Con tìm thêm một quả nữa nhé.','Giỏi lắm. Con tìm thêm một quả nữa nhé.');
}
function chooseSingle(i){
  const answerMap={2:0,3:2,5:1};
  const explanations={2:'Tưới nước giúp cây bớt héo và tươi lại.',3:'Rễ ở dưới đất và hút nước cho cây.',5:'Cây cần ánh sáng để lớn lên và xanh tốt.'};
  const buttons=[...stage.querySelectorAll('.choice')];
  const correct=answerMap[slide];
  if(i===correct){
    buttons[i].classList.add('correct');
    complete(explanations[slide]);
  } else {
    buttons[i].classList.add('wrong');
    feedback(false,'Chưa đúng. Con quan sát và nghĩ lại nhé.','Chưa đúng. Con thử lại nhé.');
    setTimeout(()=>buttons[i]&&buttons[i].classList.remove('wrong'),700);
  }
}
function chooseOrder(i){
  const expected=[1,2,0,3];
  const buttons=[...stage.querySelectorAll('.choice')];
  if(buttons[i].disabled) return;
  if(i!==expected[taskState.orderIndex]){
    buttons[i].classList.add('wrong');
    feedback(false,'Sai thứ tự rồi. Con thử lại nhé.','Con hãy bắt đầu từ hạt giống nhé.');
    setTimeout(()=>buttons[i]&&buttons[i].classList.remove('wrong'),700);
    return;
  }
  buttons[i].classList.add('correct'); buttons[i].disabled=true; taskState.orderIndex++;
  const hints=['Đúng rồi! Tiếp theo là mầm cây.','Giỏi lắm! Tiếp theo là cây non.','Rất tốt! Cuối cùng là cây trưởng thành.'];
  if(taskState.orderIndex===4) complete('Hạt nảy mầm, lớn thành cây non, rồi thành cây trưởng thành.');
  else feedback(true,hints[taskState.orderIndex-1],hints[taskState.orderIndex-1]);
}
function chooseCare(i){
  const correct=[0,1];
  const buttons=[...stage.querySelectorAll('.choice')];
  if(buttons[i].disabled) return;
  if(!correct.includes(i)){
    buttons[i].classList.add('wrong');
    feedback(false,'Việc này không tốt cho cây. Con chọn lại nhé.','Việc này không giúp cây phát triển. Con thử lại nhé.');
    setTimeout(()=>buttons[i]&&buttons[i].classList.remove('wrong'),700);
    return;
  }
  buttons[i].classList.add('correct'); buttons[i].disabled=true; picked.push(i);
  if(picked.length===2) complete('Tưới nước vừa đủ và có ánh sáng sẽ giúp cây phát triển tốt.');
  else feedback(true,'Đúng rồi! Còn một việc tốt nữa đấy.','Đúng rồi. Con tìm thêm một việc tốt nữa nhé.');
}
function next(){ stopSpeak(); if(slide<totalSlides-1){ slide++; render(); } }
function restart(){ stopSpeak(); slide=0; score=0; updateScore(); render(); }
replayVoice.onclick=()=>speakSlide();
toggleVoice.onclick=()=>{ voiceOn=!voiceOn; toggleVoice.textContent=voiceOn?'🔊':'🔇'; if(!voiceOn) stopSpeak(); else speakSlide(); };
if('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
</body>
</html>
