<script>
const stage=document.getElementById('stage'), scoreEl=document.getElementById('score'), progress=document.getElementById('progress');
const puzzles=[
 {title:'THÁM HIỂM HẠT QUẢ', desc:'Hãy phân tất cả sáu loại quả theo số hạt bên trong.',prompt:['Nhiệm vụ một.','Con hãy phân loại sáu quả.','Quả có một hạt và quả có nhiều hạt.','Con chạm vào từng quả để xếp vào giỏ nhé.'],kind:'sort',data:[['Xoài','mango',0],['Đu đủ','papaya',1],['Vải','lychee',0],['Dưa hấu','watermelon',1],['Bơ','avocado',0],['Cà chua','tomato',1]],bins:['MỘT HẠT','NHIỀU HẠT'],explain:'Xoài, vải và bơ thường có một hạt. Đu đủ, dưa hấu và cà chua có nhiều hạt.'},
 {title:'AI Ở CÙNG NHÓM?',desc:'Tìm ba loại quả có nhiều hạt trong sáu hình.',prompt:['Nhiệm vụ hai.','Trong sáu loại quả, con chọn đúng ba quả có nhiều hạt.','Hãy nhớ những điều vừa khám phá ở nhiệm vụ trước.'],kind:'multi',data:[['Vải','lychee',0],['Cà chua','tomato',1],['Bơ','avocado',0],['Đu đủ','papaya',1],['Xoài','mango',0],['Dưa hấu','watermelon',1]],correct:[1,3,5],explain:'Cà chua, đu đủ và dưa hấu có nhiều hạt ở bên trong.'},
 {title:'BỘ PHẬN NÀO CHÚNG TA ĂN?',desc:'Xếp sáu thực phẩm vào nhóm rễ, lá hoặc quả.',prompt:['Nhiệm vụ ba.','Con hãy xếp từng hình vào ba nhóm.','Ăn rễ. Ăn lá. Hoặc ăn quả.','Con quan sát thật kỹ rồi chọn nhóm nhé.'],kind:'sort',data:[['Cà rốt','carrot',0],['Xà lách','lettuce',1],['Cà chua','tomato',2],['Củ cải','radish',0],['Lá rau','leafpart',1],['Đu đủ','papaya',2]],bins:['RỄ','LÁ','QUẢ'],explain:'Cà rốt và củ cải là rễ. Rau xà lách và lá rau thuộc nhóm lá. Cà chua và đu đủ là quả.'},
 {title:'THỬ THÁCH HẠT BÍ MẬT',desc:'Phát hiện một cặp gồm quả một hạt và quả nhiều hạt.',prompt:['Nhiệm vụ bốn.','Con chọn một quả chỉ có một hạt.','Sau đó chọn một quả có nhiều hạt.','Hai quả phải thuộc hai nhóm khác nhau.'],kind:'pair',data:[['Đu đủ','papaya',1],['Vải','lychee',0],['Dưa hấu','watermelon',1],['Bơ','avocado',0],['Cà chua','tomato',1],['Xoài','mango',0]],explain:'Giỏi lắm! Con đã chọn một quả một hạt và một quả nhiều hạt.'},
 {title:'HÀNH TRÌNH CỦA HẠT',desc:'Sắp xếp đủ năm giai đoạn sinh trưởng theo thứ tự.',prompt:['Nhiệm vụ năm.','Con hãy xếp năm hình theo đúng quá trình lớn lên.','Bắt đầu từ hạt giống.','Sau đó cây nảy mầm, thành cây non, ra hoa, rồi kết quả.'],kind:'order',data:[['Cây non','plant'],['Ra hoa','flower'],['Hạt giống','seed'],['Kết quả','mango'],['Nảy mầm','sprout']],order:[2,4,0,1,3],explain:'Từ hạt, cây nảy mầm, lớn lên, ra hoa và kết quả.'},
 {title:'BÁC SĨ CỦA CÂY',desc:'Tìm hai tình huống chăm cây chưa đúng.',prompt:['Nhiệm vụ sáu.','Bốn tình huống chăm cây.','Có hai tình huống chưa đúng.','Con tìm đủ hai tình huống cần sửa nhé.'],kind:'multi',data:[['Tưới quá nhiều','flood',1],['Đủ ánh sáng','healthyplant',0],['Đặt lâu trong tối','darkplant',1],['Cây được chăm tốt','plant',0]],correct:[0,2],explain:'Tưới quá nhiều làm rễ dễ bị úng. Để cây lâu trong bóng tối khiến cây thiếu ánh sáng.'}
];
let slide=0,points=0,selected=new Set(),step=0,readEnabled=true,audioSerial=0,hasWon=false,wrongTimer=0;const voiceDefault=['Con đã sẵn sàng chưa?','Chúng mình cùng khám phá khu vườn tư duy kỳ diệu nhé.','Hãy nghe và quan sát thật kỹ.'];
function art(id,label){return `<svg class="art" role="img" aria-label="${label||id}" viewBox="0 0 200 200"><use href="#${id}"></use></svg>`}
function stopVoice(){audioSerial++;try{speechSynthesis.cancel()}catch(e){}}
function voice(strings){if(!readEnabled||!('speechSynthesis' in window))return;stopVoice();const token=audioSerial;let parts=(Array.isArray(strings)?strings:[strings]).filter(Boolean);let pos=0;function next(){if(token!==audioSerial||pos===parts.length||!readEnabled)return;let s=new SpeechSynthesisUtterance(parts[pos++]);s.lang='vi-VN';s.rate=.82;s.pitch=1;s.volume=1;let voices=speechSynthesis.getVoices();let vi=voices.find(v=>/^vi[-_]/i.test(v.lang))||voices.find(v=>v.lang==='vi');if(vi)s.voice=vi;s.onend=()=>{if(token===audioSerial)setTimeout(next,260)};s.onerror=()=>{if(token===audioSerial)setTimeout(next,260)};speechSynthesis.speak(s)}next()}
function prompt(){if(slide===0)return voice(voiceDefault);if(slide===7)return voice(['Chúc mừng con đã vượt qua các nhiệm vụ khó.','Con đã biết phân loại quả và chăm sóc cây đúng cách.']);return voice(puzzles[slide-1].prompt)}
function sayItem(i){const q=puzzles[slide-1];voice(q.data[i][0])}
function addFeedback(ok,msg,spoken){let t=document.getElementById('feedback');t.textContent=msg;t.className='feedback'+(ok?'':' err');voice(spoken||msg)}
function finish(){if(hasWon)return;hasWon=true;points+=10;scoreEl.textContent='⭐ '+points;let q=puzzles[slide-1];addFeedback(true,'🎉 Xuất sắc! '+q.explain,['Con làm đúng rồi.','Giỏi lắm.',q.explain]);document.getElementById('actions').innerHTML=`<button class="primary" onclick="nextSlide()">${slide===6?'🏆 NHẬN THƯỞNG':'🌟 QUA MÀN TIẾP'}</button>`;stage.querySelectorAll('.tile').forEach(b=>b.disabled=true)}
function tile(item,i){return `<button class="tile" data-id="${i}" onclick="pick(${i})">${art(item[1],item[0])}<strong>${item[0]}</strong><span class="checkmark"></span></button>`}
function base(tag,title,desc,body,actions=''){return `<span class="tag">${tag}</span><h1 class="title">${title}</h1><p class="desc">${desc}</p>${body}<div class="feedback" id="feedback" role="status"></div><div class="actions" id="actions">${actions}</div>`}
function render(){hasWon=false;selected=new Set();step=0;scoreEl.textContent='⭐ '+points;progress.innerHTML=Array.from({length:8},(_,i)=>`<div class="dot ${i<slide?'done':''} ${i===slide?'active':''}"></div>`).join('');if(slide===0){stage.innerHTML=base('🌼 BẮT ĐẦU','KHU VƯỜN TƯ DUY KỲ DIỆU','Con sẽ trở thành nhà khám phá hạt, quả và cây xanh.',`<div class="hero">${art('mango')}${art('papaya')}${art('wholeplant')}</div><p class="instruction">6 thử thách tư duy · Phân loại · Suy luận · Tìm quy luật</p>`,`<button class="primary" onclick="nextSlide()">🌟 BẮT ĐẦU</button>`);return}
if(slide===7){stage.innerHTML=base('🏆 HOÀN THÀNH','NHÀ KHÁM PHÁ TÀI BA','Con đã giải xong sáu nhiệm vụ của khu vườn!',`<div class="starrating">${points>=50?'🌟🌟🌟':points>=30?'🌟🌟':'🌟'}</div><div class="scorelarge">${points} / 60</div><div class="hero">${art('lychee')}${art('watermelon')}${art('healthyplant')}</div><p class="desc">Một hạt – nhiều hạt · Rễ – lá – quả · Cây lớn lên · Chăm cây đúng cách</p>`,`<button class="primary" onclick="restart()">🔄 CHƠI LẠI</button>`);setTimeout(prompt,300);return}
let q=puzzles[slide-1], extras='';if(q.kind==='sort'){extras=`<div class="binheads">${q.bins.map((b,j)=>`<div class="binhead ${j===0?'active':''}" id="bin${j}">${b}: <span id="count${j}">0</span></div>`).join('')}</div><p class="instruction" id="phase">${['Giỏ thứ nhất: '+q.bins[0], ''][0]}</p>`}
if(q.kind==='pair')extras='<p class="instruction" id="phase">Bước 1: Tìm quả MỘT HẠT</p>';
if(q.kind==='order')extras='<p class="instruction" id="phase">Bước 1: Chọn HẠT GIỐNG</p>';
if(q.kind==='multi')extras=`<p class="instruction">Chọn đủ ${q.correct.length} hình phù hợp</p>`;
let cls=q.data.length>=5?'':'two';if(q.kind==='order')cls='four';
stage.innerHTML=base(`🧠 NHIỆM VỤ ${slide} / 6`,q.title,q.desc,extras+`<div class="cards ${cls}">${q.data.map(tile).join('')}</div>`);
setTimeout(prompt,270)}
function wrong(i,spoken){const b=stage.querySelector(`[data-id="${i}"]`);b.classList.add('bad');addFeedback(false,'Chưa đúng. Quan sát và thử lại nhé!',spoken||'Con quan sát lại nhé.');setTimeout(()=>{if(stage.contains(b))b.classList.remove('bad')},620)}
function pick(i){if(hasWon)return;let q=puzzles[slide-1],b=stage.querySelector(`[data-id="${i}"]`);if(!b||b.disabled)return;const item=q.data[i];if(q.kind==='sort'){if(item[2]!==step)return wrong(i,'Quả này không thuộc nhóm đang chọn. Con thử lại nhé.');selected.add(i);b.disabled=true;b.classList.add('good');let count=Array.from(selected).filter(j=>q.data[j][2]===step).length;document.getElementById('count'+step).textContent=count;let n=q.data.filter(x=>x[2]===step).length;if(count===n){if(step===q.bins.length-1)return finish();step++;for(let j=0;j<q.bins.length;j++)document.getElementById('bin'+j).classList.toggle('active',j===step);document.getElementById('phase').textContent='Giỏ tiếp theo: '+q.bins[step];voice(['Đúng rồi.','Bây giờ con tìm nhóm '+q.bins[step]])}else voice('Chính xác. Con tìm thêm nhé.');return}
if(q.kind==='multi'){if(!q.correct.includes(i))return wrong(i,'Hình này không thuộc nhóm con cần tìm.');selected.add(i);b.disabled=true;b.classList.add('good');if(selected.size===q.correct.length)return finish();voice('Đúng rồi. Con hãy tìm tiếp.');return}
if(q.kind==='pair'){if(item[2]!==step)return wrong(i,step===0?'Con chọn quả một hạt trước nhé.':'Bây giờ con chọn quả nhiều hạt nhé.');selected.add(i);b.disabled=true;b.classList.add('good');if(step===1)return finish();step++;document.getElementById('phase').textContent='Bước 2: Tìm quả NHIỀU HẠT';voice('Đúng rồi. Bây giờ con hãy chọn một quả có nhiều hạt.');return}
if(q.kind==='order'){if(i!==q.order[step])return wrong(i,'Đây chưa phải giai đoạn tiếp theo. Con nghĩ lại nhé.');b.disabled=true;b.classList.add('good');step++;if(step===q.order.length)return finish();let next=q.data[q.order[step]][0];document.getElementById('phase').textContent='Bước '+(step+1)+': '+next.toUpperCase();voice('Đúng rồi. Tiếp theo là '+next);return}}
function nextSlide(){stopVoice();if(slide<7){slide++;render()}}function restart(){stopVoice();slide=0;points=0;render()};document.getElementById('repeat').onclick=prompt;document.getElementById('sound').onclick=()=>{readEnabled=!readEnabled;document.getElementById('sound').textContent=readEnabled?'🔊':'🔇';if(!readEnabled)stopVoice();else prompt()};render();
</script></body></html>
